
services:
  - type: web
    name: nexrwanda-api
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health/readiness

    envVars:
      - key: APP_NAME
        value: NexRwanda

      - key: APP_VERSION
        value: 1.0.0

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: API_V1_PREFIX
        value: /api/v1

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: LOG_LEVEL
        value: INFO

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false
